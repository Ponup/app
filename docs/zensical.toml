[project]
site_url = "https://ponup.com/"
site_name = "Ponup"
site_description = "Context engineering and content management for humans and AI"
site_author = "Ponup Team"

copyright = "Copyright &copy; 2026 Ponup"

repo_url = "https://github.com/Ponup/app"
repo_name = "Ponup/app"
edit_uri = "edit/main/docs/docs/"

nav = [
  { "Overview" = "index.md" },
  { "Quickstart" = "getting-started.md" },
  { "Core Concepts" = "core-concepts.md" },
  { "Model Context Protocol (MCP)" = "mcp.md" },
  { "AI & Multimodal" = "ai-multimodal.md" },
  { "API Reference" = [
      { "REST API" = "api/rest.md" },
      { "GraphQL API" = "api/graphql.md" },
  ]},
  { "Configuration & Hosting" = "configuration.md" },
  { "Development & Contributing" = "development.md" },
]

[project.theme]
logo = "images/ponup-logo.png"
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Ponup/app"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/ponup"

[[project.extra.social]]
icon = "fontawesome/brands/youtube"
link = "https://youtube.com/@ponup"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://linkedin.com/company/ponup"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
