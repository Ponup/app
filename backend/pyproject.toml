[project]
name = "ponup"
version = "0.1.0"
description = "Context engineering and content management for humans and AI"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2", "boto3>=1.35,<2", "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1", "httpx>=0.27,<1", "mcp>=1.3,<2",
  "pgvector>=0.3,<1", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3", "pypdf>=5,<6",
  "python-multipart>=0.0.17,<1", "sentence-transformers>=3.3,<4",
  "sqlalchemy>=2.0,<3", "strawberry-graphql[fastapi]>=0.250,<1",
  "torch>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]
[dependency-groups]
dev = ["mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.8,<1"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
ignore = ["B008", "TRY004"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
